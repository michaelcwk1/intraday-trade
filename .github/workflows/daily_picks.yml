name: Rekomendasi Saham Harian & Mingguan

# Membuat daftar rekomendasi setelah bursa tutup, lalu commit ke data/picks/.
# Vercel otomatis deploy ulang dan tab "Hari Ini" langsung menampilkan daftar baru.
on:
  schedule:
    # Waktu dalam UTC (WIB = UTC+7). Dijalankan beberapa kali: kalau data penutupan
    # dari Yahoo belum masuk di jadwal pertama, jadwal berikutnya mengulang.
    - cron: '30 9 * * 1-5'   # 16:30 WIB
    - cron: '15 10 * * 1-5'  # 17:15 WIB
    - cron: '0 11 * * 1-5'   # 18:00 WIB
  workflow_dispatch:          # tombol "Run workflow" manual di GitHub

permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Buat daftar rekomendasi
        run: python recommender.py --cron

      - name: Commit daftar baru
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/picks/
          if git diff --cached --quiet; then
            echo "Tidak ada daftar baru."
          else
            git commit -m "data: rekomendasi saham $(TZ=Asia/Jakarta date +'%Y-%m-%d %H:%M') WIB"
            git pull --rebase
            git push
          fi
